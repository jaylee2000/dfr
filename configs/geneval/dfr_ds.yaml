# DFR-DS on GenEval (paper Table 1): DreamSim diversity reward on the DINO branch, lambda=3, beta=2.
# Override per run, e.g.:
#   accelerate launch scripts/training_sd3.py geneval/dfr_ds --seed 1
extends: ../defaults/geneval_sd3.yaml

reverse_kl_weight: 2.0

dreamsim_scale: 3.0

# Per-process batch sizes.
loss_batch_size: 24
sampling_batch_size: 24
dreamsim_batch_size: 12
fd_batch_size: 12
