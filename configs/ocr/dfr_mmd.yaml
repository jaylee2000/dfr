# DFR-MMD on OCR (paper Table 2): energy-kernel MMD to the base model on normalized
# VAE latents, exponent b=1.75, M=8 reference samples per prompt, lambda=1.5, beta=4.
# Override per run, e.g.:
#   accelerate launch --module dfr.training_sd3 ocr/dfr_mmd --seed 1
extends: ../defaults/ocr_sd3.yaml

reverse_kl_weight: 4.0

energy_scale: 1.5
energy_beta: 1.75
energy_lambda: 1.0
energy_reference_samples_per_prompt: 8

# Per-process batch sizes.
sampling_batch_size: 24
