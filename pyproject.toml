# Static metadata for mmcv 2.1.0 (requirements/runtime.txt plus the OpenCV
# choice in setup.py), so resolving never builds its sdist. To regenerate
# uv.lock, comment out no-build-package above for the `uv lock` call only.
[[tool.uv.dependency-metadata]]
name = "mmcv"
version = "2.1.0"
requires-python = ">=3.7"
requires-dist = [
    "addict",
    "mmengine>=0.3.0",
    "numpy",
    "opencv-python>=3",
    "packaging",
    "Pillow",
    "pyyaml",
    "regex; sys_platform == 'win32'",
    "yapf",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
paddlepaddle-gpu = { index = "paddle-cu126" }
clip = { git = "https://github.com/openai/CLIP.git", rev = "d05afc436d78f1c48dc0dbf8e5980a9d471f35f6" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.setuptools.packages.find]
include = ["dfr*"]

[tool.black]
line-length = 120
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 120
