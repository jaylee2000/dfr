[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfr"
version = "0.1.0"
description = "Distribution-based regularization for reward fine-tuning diffusion and flow models"
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "MIT" }
authors = [{ name = "Jeongjae Lee" }, { name = "Romeo Passaro" }, { name = "Danyal Rehman" }]

# Core dependencies pinned to the versions used in the paper experiments.
# These are CUDA builds — install on a machine with a CUDA-capable GPU.
dependencies = [
    # Deep-learning core
    "torch==2.6.0",
    "torchvision==0.21.0",
    # Diffusion / RL stack
    "diffusers==0.37.0",
    "transformers==4.57.6",
    "accelerate==1.2.1",
    "peft==0.18.1",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.26",
    "sentencepiece==0.2.0",
    "protobuf==3.20.3",
    # Reward models — training rewards
    "image-reward==1.5",
    "clip==1.0",
    "paddleocr==2.9.1",
    "paddlepaddle-gpu==3.3.1",
    "Levenshtein==0.27.3",
    # Reward models — image-quality / evaluation
    "open-clip-torch==2.32.0",
    "clip-benchmark==1.6.2",
    "mmcv==2.1.0",
    "mmdet==3.3.0",
    "mmengine==0.10.7",
    "dreamsim==0.2.1",
    # Utilities
    "numpy==1.26.4",
    "Pillow==11.1.0",
    "PyYAML==6.0.2",
    "wandb==0.19.8",
]

[dependency-groups]
build = [
    "packaging==26.2",
    "psutil==7.2.2",
    "setuptools==69.5.1",
    "wheel==0.47.0",
]

[tool.uv]
required-version = ">=0.11.28,<0.12"
default-groups = ["build"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# MMCV must come from the validated binary artifact. Consumer provisioning
# also passes --no-install-package mmcv, so uv can never fall back to compiling.
no-build-package = ["mmcv"]
# The known-good environment uses NCCL 2.21.5. PaddlePaddle GPU 3.3.1
# declares 2.25.1, so this deliberate override is required for resolution.
override-dependencies = ["nvidia-nccl-cu12==2.21.5"]
# Freeze the first uv reproduction to the package versions exported from the
# working CUDA 12.6 environment. Constraints do not install packages by
# themselves; they only pin packages already present in the dependency graph.
constraint-dependencies = [
    "accelerate==1.2.1",
    "addict==2.4.0",
    "aiohappyeyeballs==2.6.2",
    "aiohttp==3.14.1",
